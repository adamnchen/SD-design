user  root;
worker_processes  1;

#pid        logs/nginx.pid;

events {
    worker_connections  1024;
}


http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  logs/access.log  main;
    sendfile        on;
    #tcp_nopush     on;
    keepalive_timeout  65;
    gzip  on;

    #创建缓存,levels=1:2创建两级缓存第一级1个字符,第二级2个字符,nginx的缓存是存在储存中的
    proxy_cache_path   /usr/local/nginx/cache/first levels=1:2 keys_zone=first:20m max_size=1g;
    # 图片缓存设置
    open_file_cache max=1000 inactive=30s;    
  
    # 业务端
    server {
        listen       80;
        server_name  210.28.224.67;

        root  /usr/local/nginx/html/web;
        access_log  logs/access.log;

        client_max_body_size 500m;

        #ssl_certificate    /usr/local/nginx/conf/PEM/public.pem;
        #ssl_certificate_key    /usr/local/nginx/conf/PEM/privatekey.key;
        #ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
        #ssl_ciphers  HIGH:!aNULL:!MD5;
        #ssl_session_cache shared:SSL:10m;
        #ssl_session_timeout 10m;

        gzip on;
        gzip_disable "msie6";
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 5;
        gzip_min_length  1024;
        gzip_buffers 16 8k;
        gzip_http_version 1.1;
        gzip_types text/plain application/css text/css application/xml text/javascript application/javascript application/x-javascript image/jpeg image/gif image/png; 

        add_header 'Access-Control-Allow-Origin' '*';
        add_header 'Access-Control-Allow-Credentials' 'true';
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
        add_header 'Access-Control-Allow-Headers' 'DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type';

        location ~.*\.(js|woff|css)$ {
            root  /usr/local/nginx/html/web;
            expires 30s;
        }
        location ~.*\.(png|jpg|gif|jpeg)$ {
            root  /usr/local/nginx/html/web;
            expires 10d;
        }

        location /vue3-antdv-admin {
            root  /usr/local/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /vue3-antdv-admin/index.html; ##配置vue路由
            #add_header Cache-Control no-store;
        }

        location / {	
            root /usr/local/nginx/html/web;
            index index.html index.htm;
            try_files $uri $uri/ /index.html; ##配置vue路由
            #add_header Cache-Control no-store;
            proxy_cache first;  #打开定义的缓存
            proxy_cache_valid 200 10m; #如果返回码是200缓存10分钟
        }

        location /api/ {
            client_max_body_size 600M;
            client_body_buffer_size 600M;
            proxy_pass http://210.28.224.67:8080/;
            add_header Cache-Control no-store;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
		
        location ^~/api/sd/msg {
            client_max_body_size 600M;
            client_body_buffer_size 600M;
            proxy_pass http://210.28.224.67:8080/api/sd/msg/;
            add_header Cache-Control no-store;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/ai/sse {
            proxy_pass http://210.28.224.67:8080/ai/sse;  # 将backend_server替换为实际后端服务器的地址，例如http://127.0.0.1:8080
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400;  # 设置读取超时时间，这里设置为1天，可以根据实际情况调
        }

        location ^~/img/ {
            client_max_body_size 600M;
            client_body_buffer_size 600M;
            proxy_pass http://210.28.224.67:9000/;
            proxy_temp_file_write_size 10m;
        }

        location /youdao/ {
            proxy_pass https://openapi.youdao.com/api;
            add_header Cache-Control no-store;
        }

        location /baidu {
            proxy_pass https://fanyi-api.baidu.com/api/trans/vip/translate;
            add_header Cache-Control no-store;
        }
		
        location /sutran/ {
            proxy_pass http://210.28.224.67:9000/sutran;
            add_header Cache-Control no-store;
        }

        location ^~/lora-img {
            alias /data/sd/data/models/Lora/;
            client_body_buffer_size 256k;
            expires  90d;
            proxy_buffer_size  32k;
            proxy_buffers   4 64k;
            proxy_busy_buffers_size 128k;
            proxy_temp_file_write_size 10m;
            proxy_cache first;  #打开定义的缓存
            proxy_cache_valid 200 10m; #如果返回码是200缓存10分钟
        }

        location ^~/train-data {
            alias /data/train/train-data/;
            proxy_buffer_size  32k;
            proxy_buffers   4 64k;
            proxy_busy_buffers_size 128k;
            proxy_temp_file_write_size 10m;
            proxy_cache first;  #打开定义的缓存
            proxy_cache_valid 200 10m; #如果返回码是200缓存10分钟
        }

        location ^~/grids {
            alias /data/sutran-sd-v1/grids/;
            client_body_buffer_size 256k;
            expires  90d;
            proxy_buffer_size  32k;
            proxy_buffers   4 64k;
            proxy_busy_buffers_size 128k;
            proxy_temp_file_write_size 10m;
            proxy_cache first;  #打开定义的缓存
            proxy_cache_valid 200 10m; #如果返回码是200缓存10分钟
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
           root   /usr/share/nginx/html/web;
        }

	}

    # 后台管理
    server {
        listen       8082;
        server_name  210.28.224.67;

        root  /usr/local/nginx/html/admin;

        client_max_body_size 500m; 
        #ssl_certificate    /usr/local/nginx/conf/PEM/public.pem;
        #ssl_certificate_key    /usr/local/nginx/conf/PEM/privatekey.key;
        #ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
        #ssl_ciphers  HIGH:!aNULL:!MD5;
        #ssl_session_cache shared:SSL:10m;
        #ssl_session_timeout 10m;

        gzip on;
        gzip_disable "msie6";
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 5;
        gzip_buffers 16 8k;
        gzip_http_version 1.1;
        gzip_types text/plain application/css text/css application/xml text/javascript application/javascript application/x-javascript;

        add_header 'Access-Control-Allow-Origin' '*';
        add_header 'Access-Control-Allow-Credentials' 'true';
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
        add_header 'Access-Control-Allow-Headers' 'DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type';

        location ~.*\.(js|woff|css)$ {
            root  /usr/local/nginx/html/admin;
            expires 30s;
        }
        location ~.*\.(png|jpg|gif|jpeg)$ {
            root  /usr/local/nginx/html/admin;
            expires 30s;
        }	
        location /vue3-antdv-admin {
            root  /usr/local/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /vue3-antdv-admin/index.html; ##配置vue路由
            add_header Cache-Control no-store;
        }	
        location / {	
            root /usr/local/nginx/html/admin;
            index index.html index.htm;
            try_files $uri $uri/ /index.html; ##配置vue路由
            add_header Cache-Control no-store;
        }
        location /prod-api/ {
            client_max_body_size 600M;
            client_body_buffer_size 600M;
            proxy_pass http://210.28.224.67:8080/;
            add_header Cache-Control no-store;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/local/nginx/html/admin;
        }
    }
	
    # minio服务
    server {
        listen       80;
        server_name  file.zeinai.net;

        #ssl_certificate    /usr/local/nginx/conf/PEM/public.pem;
        #ssl_certificate_key    /usr/local/nginx/conf/PEM/privatekey.key;
        #ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
        #ssl_ciphers  HIGH:!aNULL:!MD5;
        #ssl_session_cache shared:SSL:10m;
        #ssl_session_timeout 10m;

        gzip on;
        gzip_disable "msie6";
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 5;
        gzip_buffers 16 8k;
        gzip_http_version 1.1;
        gzip_min_length 1024;
        gzip_types text/plain application/css text/css application/xml text/javascript application/javascript application/x-javascript image/jpeg image/gif image/png;

        add_header 'Access-Control-Allow-Credentials' 'true';
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
        add_header 'Access-Control-Allow-Headers' 'DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type';

        client_max_body_size 500m;

        location / {
            client_max_body_size 600M;
            client_body_buffer_size 600M;
            proxy_pass http://210.28.224.67:9000/;
            proxy_temp_file_write_size 10m;
        }
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html/admin;
        }
    }

    #include /usr/local/nginx/conf/conf.d/*.conf;
}
